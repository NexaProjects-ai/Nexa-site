name: Pages integrity

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify public site invariants
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f CNAME
          grep -qx 'nexaproject.be' CNAME
          test -f .nojekyll

          # Telecom concierge-MVP: route + privacy invariants.
          test -f telecom/index.html
          test -f telecom/factuurcheck-start.html
          grep -q 'lang="nl-BE"' telecom/index.html
          grep -q 'href="./factuurcheck-start.html"' telecom/index.html
          grep -q 'lang="nl-BE"' telecom/factuurcheck-start.html
          grep -q 'content="noindex"' telecom/factuurcheck-start.html
          grep -q 'mailto:hello@nexaproject.be' telecom/factuurcheck-start.html
          grep -q 'De website zelf uploadt of bewaart geen document' telecom/factuurcheck-start.html
          grep -q 'deel ze niet met derden' telecom/factuurcheck-start.html

          # Fail closed if the public flow starts handling files or transmitting data in-page.
          ! grep -Eqi 'type=.file|<form|fetch\(|XMLHttpRequest|navigator\.sendBeacon' telecom/index.html telecom/factuurcheck-start.html

          echo 'Pages integrity OK: core site + telecom route/privacy invariants present.'
